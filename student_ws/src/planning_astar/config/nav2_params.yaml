# RB3302 Nav2 parameters, tuned for:
#   - Wave Rover, measured 18 x 19 cm (footprint uses 19 x 19 cm, see below)
#   - 4 x 6 course of 60 cm squares, walls drawn 10 cm thick in rb3302_map.pgm
#     -> 50 cm of free space per square, ~15 cm clearance each side when centred
#   - graded run: reach + stop 3 s on each of 4 squares inside 3 min

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # EKF odom (wheel vx + IMU yaw) is decent; 0.8 spread particles too much.
    # Heading comes from the IMU via EKF, so odometry can be trusted more.
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.15            # ignore returns off the robot's own body
    laser_max_range: 6.0             # whole course is < 4 m across
    max_beams: 90
    sigma_hit: 0.1
    z_hit: 0.6
    z_rand: 0.4
    laser_likelihood_max_dist: 1.0
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    # Update often: cells are only 60 cm and the start yaw is only +/-45 deg.
    update_min_d: 0.05
    update_min_a: 0.1
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    transform_tolerance: 0.5
    tf_broadcast: true
    save_pose_rate: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # default 0.5 m is almost a whole square; slow final approach would trip it
      required_movement_radius: 0.10
      # allow for in-place turns in dead ends (e.g. N), which do not count as movement
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Scoring needs the robot inside the square AND over the centre label.
      xy_goal_tolerance: 0.04
      # Orientation is not scored -> do not waste time turning at each square.
      yaw_goal_tolerance: 3.14
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.22
      # Short lookahead so the carrot does not cut 90 deg corners into walls.
      # 0.20 also keeps the steady heading error on the 0.30 m corner arcs of
      # course_runner's grid path below rotate_to_heading_min_angle.
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      # 4WD skid-steer only turns at ~1/3 of the commanded rate (360 deg spin took 18 s at 1.0).
      # Teleop turns well at 1.5; driver clamps at 3.0.
      # 2.5 overshot every turn (RPP has no slow-down near the target heading),
      # so it is back to 1.5. Big turns are done by Spin in course_runner,
      # which does slow down; this is only the fallback.
      rotate_to_heading_angular_vel: 1.5
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Slow down on the 0.30 m corner arcs (0.22 * 0.30 / 0.45 = 0.15 m/s)
      # so the skid-steer can keep up with the turn.
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.12
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.12
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 10.0   # must match local inflation_layer
      allow_reversing: false
      use_rotate_to_heading: true
      # Arcs command only w = v * curvature (0.3-0.6 rad/s at < 23 deg error,
      # ~0.1-0.2 rad/s actual). 0.25 (14 deg) made the robot stop and spin
      # whenever a 1 Hz replan or an AMCL correction moved the carrot a few cm
      # sideways (6 cm at 0.25 m lookahead is 14 deg), and then it overshot.
      # 45 deg lets RPP steer through small errors and the grid path's arcs
      # while driving; turns at the start of a leg are done by Spin.
      rotate_to_heading_min_angle: 0.785
      # RPP limits each in-place turn command to measured rate + accel*dt.
      # At 2.0 that is 0.1 rad/s from standstill, too little to beat tyre scrub,
      # so the robot never starts turning. Smoothing is left to velocity_smoother.
      max_angular_accel: 20.0
      max_robot_pose_search_dist: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      # 18 x 19 cm measured; length/width axis not specified, so 19 cm is used
      # on both axes (costs 5 mm). base_link assumed at the chassis centre.
      footprint: "[[0.095, 0.095], [0.095, -0.095], [-0.095, -0.095], [-0.095, 0.095]]"
      # 0.01 -> 0.02: 1 cm more margin for differences between the mapped and real walls
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.095, 0.095], [0.095, -0.095], [-0.095, -0.095], [-0.095, 0.095]]"
      # 0.01 -> 0.02: 1 cm more margin for differences between the mapped and real walls
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        # Marks the possible obstacle blocking a square so A* routes around it.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 2.5
          raytrace_min_range: 0.15
          raytrace_max_range: 3.0
      inflation_layer:
        # Centre of a 50 cm gap is ~0.275 m from the wall cell centres:
        # cost there ~45/252, so A* is pulled to the middle of each square.
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      tolerance: 0.05
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    # Spin slows down as it nears the target; 1.8 cap keeps the 90 deg leg
    # turns from overshooting (2.5 overshot).
    max_rotational_vel: 1.8
    min_rotational_vel: 0.6
    rotational_acc_lim: 4.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    # Driver (driver.launch.py) clamps at 0.8 m/s / 3.0 rad/s. Linear kept low for the 60 cm grid;
    # angular at the clamp because skid-steer turns at ~1/3 of the command.
    max_velocity: [0.25, 0.0, 2.8]
    min_velocity: [-0.25, 0.0, -2.8]
    max_accel: [0.6, 0.0, 6.0]
    # Angular decel -10: stop a turn quickly once RPP ends it, so less overshoot.
    max_decel: [-0.6, 0.0, -10.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      # Rule is 3 s stop per square; 0.5 s margin for timing jitter.
      waypoint_pause_duration: 3500
