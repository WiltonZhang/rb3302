# RB3302 Nav2 parameters (planning_rpp and planning_astar use the same file), tuned for:
#   - Wave Rover 4WD skid-steer, measured 18 x 19 cm. It turns at ~1/3-1/2 of the
#     commanded rate and stalls below ~1.0 rad/s (tyre scrub).
#   - rb3302_map: 4 x 6 squares of 58.25 cm, walls drawn 2 px (9.7 cm) thick
#     -> 48.5 cm of free space per square in the map (~56 cm on the real course)
#   - graded run: reach + stop 3 s on each of 4 squares inside 3 min
#   - wheel odometry with its sign restored by course_runner's odom_sign node:
#       ros2 launch planning_rpp planning.launch.py raw_odom_topic:=/odom/raw_signed
#     The board reports wheel speed without a sign, so turning on the spot and
#     reversing used to read as driving forward (see docs/claude-handoff/TUNING_REVIEW.md).
# Base: the 116bdf3 values. Every value changed from 116bdf3 says so in its comment.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Let the LiDAR correct the wheels. At 0.1 AMCL followed the odometry's
    # phantom forward motion during turns on the spot and lost the robot
    # (std 0.4-0.56 m in the c2bb18f / 04af912 runs). Friend B runs 0.3-0.4,
    # friend A 0.8. (116bdf3: 0.1, 0.1, 0.1, 0.1, 0.2)
    alpha1: 0.4    # rotation noise from rotation
    alpha2: 0.3    # rotation noise from translation
    alpha3: 0.4    # translation noise from translation
    alpha4: 0.4    # translation noise from rotation
    alpha5: 0.3    # omni robots only, unused
    laser_model_type: likelihood_field
    laser_min_range: 0.15            # ignore returns off the robot's own body
    laser_max_range: 6.0             # whole course is < 4 m across
    max_beams: 90
    sigma_hit: 0.1
    # Weight scan points that land on mapped walls more (friend A's values,
    # tuned on a real-robot recording). (116bdf3: z_hit 0.6, z_rand 0.4)
    z_hit: 0.8
    z_rand: 0.2
    laser_likelihood_max_dist: 1.0
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.05
    # Update every ~3 deg of turning so the heading stays right through turns
    # (friend A 0.05, friend B 0.03). (116bdf3: 0.1)
    update_min_a: 0.05
    resample_interval: 1
    # No random particles: in a grid of identical squares they jump to the wrong square.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    transform_tolerance: 0.5
    tf_broadcast: true
    save_pose_rate: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # course_runner replans after every aborted leg (3 attempts), so a brief false
    # "collision ahead" near the obstacle or a wall should not cost one. (was 0.3)
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # default 0.5 m is almost a whole square; slow final approach would trip it
      required_movement_radius: 0.10
      # allow for in-place turns in dead ends (e.g. N), which do not count as movement
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Scoring needs the robot over the centre label. course_runner ends every
      # path goal_extension (3 cm) past the centre, so with this tolerance the
      # robot stops on the centre instead of 3-4 cm short. 7f6eeaf used 0.03 in
      # the run that "went almost perfectly". (116bdf3: 0.04)
      xy_goal_tolerance: 0.03
      # Orientation is not scored -> do not waste time turning at each square.
      yaw_goal_tolerance: 3.14
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 7f6eeaf's speed. Back to 0.22 if a 4-square mission gets close to 3 min.
      # (116bdf3: 0.22)
      desired_linear_vel: 0.18
      # Fixed 0.25 m lookahead: 0.20 still wobbled a little on each AMCL correction,
      # 0.15 (7f6eeaf) zigzagged; friends run 0.25 and 0.30. Velocity-scaled
      # (0cbd2e4) followed the driver's jumpy speed reading. (was 0.20)
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      # The turn rate that ran on the robot. 1.2 / 1.0 / 0.8 (3023d14, dbacc72,
      # 479a950) stalled near tyre scrub; 2.5 (d4c9121) overshot every turn.
      rotate_to_heading_angular_vel: 1.5
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      # Below ~0.12 m/s the arc turn command (speed x curvature) is too small to
      # turn the skid-steer (0cbd2e4 used 0.08 and got stuck turning).
      regulated_linear_scaling_min_speed: 0.12
      # Off: once the local costmap really sees the walls (max_obstacle_height
      # below) this would slow the robot whenever a wall is near, which is
      # everywhere in a 58 cm square. Both friends run it off. (116bdf3: true)
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.12
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 10.0   # must match local inflation_layer
      allow_reversing: false
      use_rotate_to_heading: true
      # Turn on the spot only when the carrot is more than 45 deg off. 0.5 (7f6eeaf)
      # and 0.25 (d4c9121) turned small AMCL corrections into stop-and-spin events;
      # 1.0 (0cbd2e4) started turns too late.
      rotate_to_heading_min_angle: 0.785
      # RPP limits each turn command to the measured turn rate + accel * dt. At 2.0
      # that is 0.1 rad/s from standstill, which never beats tyre scrub.
      max_angular_accel: 20.0
      max_robot_pose_search_dist: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      # Template parameter. 18 x 19 cm measured; the length/width axis is not
      # specified, so 19 cm is used on both axes. base_link assumed at the chassis
      # centre. Same as 116bdf3. (template: 5 x 5 cm square)
      footprint: "[[0.095, 0.095], [0.095, -0.095], [-0.095, -0.095], [-0.095, 0.095]]"
      footprint_padding: 0.0   # 1 cm more room each side in tight spots (was 0.01)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          # Nav2's default for a scan source is 0.0 m and the LiDAR sits 9 cm above
          # base_link, so without this every scan point was thrown away: this
          # costmap stayed empty and an obstacle box would be invisible (friend A
          # found the same). (116bdf3: not set)
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 2.0
          raytrace_min_range: 0.15
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The static layer resizes this costmap to the map anyway; set to match
      # rb3302_map.yaml. (116bdf3: 0.05, the old map's resolution)
      resolution: 0.04854167
      # This costmap can only start once AMCL publishes map->odom, i.e. after the
      # start pose is sent. The default 60 s made Nav2 give up when the run was
      # started more than a minute after the launch (friend A's fix). (116bdf3: not set)
      initial_transform_timeout: 600.0
      # same 19 x 19 cm square as local_costmap (template: 5 x 5 cm square)
      footprint: "[[0.095, 0.095], [0.095, -0.095], [-0.095, -0.095], [-0.095, 0.095]]"
      footprint_padding: 0.0   # 1 cm more room each side in tight spots (was 0.01)
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        # Marks the possible obstacle blocking a square so course_runner routes around it.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0     # see local_costmap (116bdf3: not set)
          obstacle_min_range: 0.15
          obstacle_max_range: 2.5
          raytrace_min_range: 0.15
          raytrace_max_range: 3.0
      inflation_layer:
        # A square centre is 0.243 m from the drawn walls: cost there ~90/252, so
        # NavFn (fallback planner) is pulled to the middle of each square.
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      tolerance: 0.05
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    # Spin checks this much turning ahead for collisions. With the square footprint
    # (corners sweep 13.4 cm) 1.0 s (~100 deg) refused turns next to the obstacle
    # or a wall. Friend B uses 0.5. (was 1.0)
    simulate_ahead_time: 0.5
    # Spin slows down as it nears the target; 1.8 cap keeps the 90 deg leg
    # turns from overshooting (2.5 overshot).
    max_rotational_vel: 1.8
    # Spin ramps down to this for the last few degrees. 0.6 is below the
    # ~0.8-1.0 rad/s this base needs to beat tyre scrub, so it could stall a few
    # degrees short and sit there until the time allowance ran out (a stop at the
    # turn). 1.0 rad/s did turn the robot in the first field test. (116bdf3: 0.6)
    min_rotational_vel: 1.0
    rotational_acc_lim: 4.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    # Driver (driver.launch.py) clamps at 0.8 m/s / 3.0 rad/s. Linear kept low for the
    # 58 cm grid; angular near the clamp because skid-steer turns at ~1/3 of the command.
    max_velocity: [0.25, 0.0, 2.8]
    min_velocity: [-0.25, 0.0, -2.8]
    max_accel: [0.6, 0.0, 6.0]
    # Angular decel -10: stop a turn quickly once RPP ends it, so less overshoot.
    max_decel: [-0.6, 0.0, -10.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      # Rule is 3 s stop per square; 0.5 s margin for timing jitter.
      waypoint_pause_duration: 3500
