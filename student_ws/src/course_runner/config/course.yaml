# Grid geometry in the map frame of student_ws/maps/rb3302_map.yaml.
# In that map North = +x, West = +y; square A centre is at (1.725, 2.905).
# Use with: ros2 run course_runner run_course ... --ros-args --params-file <this>
course_runner:
  ros__parameters:
    frame_id: map
    cell_size: 0.60
    a_center_x: 1.725
    a_center_y: 2.905
    north_yaw: 0.0        # map yaw of course North (rad)
    xy_stddev: 0.15       # start-square uncertainty given to AMCL (m)
    yaw_stddev: 0.5       # brief says bearing is +/-45 deg
    spin_angle: 6.283     # one full turn to converge AMCL before driving
    spin_time_allowance: 25.0
    # --- grid planner (default --planner grid) ---
    base_frame: base_link
    corner_radius: 0.0    # 0: straight runs, stop and turn on the spot at corners;
                          # > 0 (<= cell/2): rounded corner arcs of that radius
    path_step: 0.025      # path point spacing (m)
    turn_penalty: 1.0     # A* extra cost per corner (a stop + turn costs about one square)
    goal_extension: 0.03  # path ends this far past each centre so the goal checker
                          # (xy_goal_tolerance 0.04) stops the robot on the centre
    centre_tolerance: 0.05 # further than this from a goal centre -> one straight correction
    stop_seconds: 3.5     # rule is 3 s stopped per square; 0.5 s margin
    align_min_angle: 0.20 # turn on the spot before a leg if heading is off by more (rad)
    align_time_allowance: 10.0
    blocked_cost: 99      # global costmap value (99 inscribed, 100 lethal) that blocks a square
    replan_attempts: 3    # grid replans per leg before falling back to the Nav2 planner
    controller_id: FollowPath
    goal_checker_id: goal_checker
