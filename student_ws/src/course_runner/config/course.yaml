# Grid geometry in the map frame of student_ws/maps/rb3302_map.yaml.
# In that map +x is East, +y is North and (0, 0) is the south-west corner of the
# course; squares are 0.5825 m, so square A's centre is at (0.29125, 2.03875).
# These are also the defaults in run_course.py, so this file is only needed to
# change them: ros2 run course_runner run_course ... --ros-args --params-file <this>
course_runner:
  ros__parameters:
    frame_id: map
    cell_size: 0.5825
    a_center_x: 0.29125
    a_center_y: 2.03875
    north_yaw: 1.5707963  # map yaw of course North (rad): +y
    # AMCL rounds to the nearest map-cell corner, so its poses are half a cell
    # (0.0243 m) low in x and y; aim the same amount low. 0.0 = aim at map centres.
    aim_offset_x: -0.0243
    aim_offset_y: -0.0243
    xy_stddev: 0.15       # start-square uncertainty given to AMCL (m)
    yaw_stddev: 0.6       # brief says bearing is +/-45 deg
    # --localise still (default): AMCL updates with the robot standing still
    localise_match_distance: 0.10   # a scan point within this of a wall counts (m)
    localise_match_fraction: 0.95   # stop once this share of scan points match
    localise_max_updates: 50
    localise_timeout: 30.0
    # --localise spin: one full turn instead
    spin_angle: 6.283
    spin_time_allowance: 25.0
    # --- grid planner (default --planner grid) ---
    base_frame: base_link
    corner_radius: 0.29   # arc radius at squares the route turns in (<= cell/2 stays inside)
    path_step: 0.025      # path point spacing (m)
    turn_penalty: 0.5     # A* extra cost per corner: prefer routes with fewer turns
    stop_seconds: 3.5     # rule is 3 s stopped per square; 0.5 s margin
    align_min_angle: 0.30 # turn on the spot before a leg if heading is off by more (rad); smaller errors left to RPP
    align_time_allowance: 6.0   # give up a stuck turn on the spot after this (s)
    goal_extension: 0.06  # end each leg's path this far past the centre (= goal checker xy tolerance; was 0.08)
    centre_goal_extension: 0.06   # final drive onto the centre ends this far past it (= its checker's xy tolerance; was 0.08)
    # Leaving a dead end (H, J, K, N) after centring on it: turn to face the exit and
    # drive straight onto the exit square's centre at the normal speed (2x dashed),
    # turning like Spin in 48fe575, with its own LiDAR wall checks; the normal leg
    # carries on from the exit square.
    fast_exit: true
    cmd_vel_topic: /cmd_vel
    exit_linear_speed: 0.275    # = desired_linear_vel 0.275 (m/s) (was 0.44)
    exit_linear_accel: 0.6      # ramp up/down (m/s2), as the velocity smoother
    exit_turn_speed: 1.5        # = Spin max_rotational_vel 1.5 (rad/s) (was 3.0)
    exit_turn_accel: 4.0        # = Spin rotational_acc_lim 4.0: slows as sqrt(2 x 4 x angle left) (was 6.0)
    exit_turn_min_speed: 1.0    # below ~1.0 rad/s the skid-steer stalls
    exit_turn_tolerance: 0.05   # stop turning within this of the exit heading (rad)
    exit_turn_clearance: 0.155  # no LiDAR point closer than this to base_link when turning (corner 0.134 + 2 cm)
    exit_side_clearance: 0.125  # corridor half-width checked ahead while driving out (0.095 + 3 cm)
    exit_front_margin: 0.05     # extra distance beyond the stopping distance checked ahead (m)
    exit_timeout: 6.0           # give up turning or driving after this (s)
    centre_tolerance: 0.06    # get onto a centre if further off (m); 0.06 skips extra start-up turns from hand placement
    centre_ahead_angle: 1.05  # ...and only if the centre is within 60 deg of the heading
    centre_turn_angle: 0.785  # before a turn on the spot bigger than this (rad), get onto the centre first
    centre_turn_limit: 1.75   # ...facing a centre up to ~100 deg to the side with a small turn first
    blocked_cost: 99      # global costmap value (99 inscribed, 100 lethal) that blocks a square
    monitor_period: 0.5   # while driving, check the path ahead in the costmap this often (s)
    monitor_distance: 1.2 # how far ahead along the path to check (m)
    replan_attempts: 2    # grid replans per leg before falling back to the Nav2 planner
    server_timeout: 10.0  # give up waiting for a Nav2 action server after this (s)
    controller_id: FollowPath
    goal_checker_id: goal_checker
    centre_goal_checker_id: goal_checker  # goal checker for the final drive onto the centre (nav2_params has only goal_checker)
